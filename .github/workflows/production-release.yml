name: Production release

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      schema_only:
        description: Publish and verify the production Jazz schema without deploying Vercel
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: Production
    steps:
      - name: Verify required release secrets
        shell: bash
        env:
          SCHEMA_ONLY: ${{ inputs.schema_only || false }}
          JAZZ_PRODUCTION_APP_ID: ${{ secrets.JAZZ_PRODUCTION_APP_ID }}
          JAZZ_PRODUCTION_SERVER_URL: ${{ secrets.JAZZ_PRODUCTION_SERVER_URL }}
          JAZZ_PRODUCTION_ADMIN_SECRET: ${{ secrets.JAZZ_PRODUCTION_ADMIN_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          required=( \
            JAZZ_PRODUCTION_APP_ID \
            JAZZ_PRODUCTION_SERVER_URL \
            JAZZ_PRODUCTION_ADMIN_SECRET
          )
          if [[ "$SCHEMA_ONLY" != "true" ]]; then
            required+=(VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID)
          fi
          for variable in "${required[@]}"
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Missing production environment secret: ${variable}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Jazz schema
        run: npm run jazz:validate

      - name: Check
        env:
          # Compile-time presence only; the Vercel build later pulls the real value.
          OPENAI_API_KEY: ci-placeholder
        run: npm run check

      - name: Test
        env:
          OPENAI_API_KEY: ci-placeholder
        run: npm test

      - name: Publish production Jazz schema and permissions
        env:
          PUBLIC_JAZZ_APP_ID: ${{ secrets.JAZZ_PRODUCTION_APP_ID }}
          PUBLIC_JAZZ_SERVER_URL: ${{ secrets.JAZZ_PRODUCTION_SERVER_URL }}
          JAZZ_ADMIN_SECRET: ${{ secrets.JAZZ_PRODUCTION_ADMIN_SECRET }}
        run: |
          npx --no-install jazz-tools deploy "$PUBLIC_JAZZ_APP_ID" \
            --schema-dir src/lib \
            --migrations-dir src/lib/migrations \
            --server-url "$PUBLIC_JAZZ_SERVER_URL" \
            --admin-secret "$JAZZ_ADMIN_SECRET"

      - name: Verify production Jazz permission head
        env:
          PUBLIC_JAZZ_APP_ID: ${{ secrets.JAZZ_PRODUCTION_APP_ID }}
          PUBLIC_JAZZ_SERVER_URL: ${{ secrets.JAZZ_PRODUCTION_SERVER_URL }}
          JAZZ_ADMIN_SECRET: ${{ secrets.JAZZ_PRODUCTION_ADMIN_SECRET }}
        run: |
          npx --no-install jazz-tools permissions status "$PUBLIC_JAZZ_APP_ID" \
            --schema-dir src/lib \
            --server-url "$PUBLIC_JAZZ_SERVER_URL" \
            --admin-secret "$JAZZ_ADMIN_SECRET" \
            | tee /tmp/jazz-permissions-status.log
          grep -F "Current server permissions already target this structural schema." \
            /tmp/jazz-permissions-status.log

      - name: Install Vercel CLI
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.schema_only != true }}
        run: npm install --global vercel@58.7.1

      - name: Pull production Vercel settings
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.schema_only != true }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.schema_only != true }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy verified artifact to Vercel Production
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.schema_only != true }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
