name: CI

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['master']

  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Validate Jazz schema
        run: npm run jazz:validate
      - name: Check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
